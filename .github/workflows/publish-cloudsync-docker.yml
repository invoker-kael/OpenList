name: Publish CloudSync Docker

on:
  push:
    branches:
      - feature/cloudsync-writeback
    paths:
      - .github/workflows/publish-cloudsync-docker.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_and_push:
    name: Build and push linux/amd64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validated source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: 8d64162d3ee00f21ae4c3e4ee8fad313aa9ab752

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: invokerkael
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          build-args: |
            FRONTEND_REPO=invoker-kael/OpenList-Frontend
            FRONTEND_REF=2aa576692cf788d9eeda31287edc8b8c6ec0b5e0
            FRONTEND_I18N_URL=https://github.com/OpenListTeam/OpenList-Frontend/releases/download/v4.2.6/i18n.tar.gz
          push: true
          tags: |
            invokerkael/openlist:cloudsync-writeback
            invokerkael/openlist:8d64162d
          provenance: false
