name: Publish CloudSync Docker

on:
  push:
    branches:
      - feature/cloudsync-writeback
    paths:
      - .github/workflows/publish-cloudsync-docker.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_and_push:
    name: Build and push linux/amd64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validated source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: 833db4af966aaa4e6be48c2b60444d5232b8d387

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: invokerkael
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          build-args: |
            FRONTEND_REPO=invoker-kael/OpenList-Frontend
            FRONTEND_REF=c55b12c6979ce1f8c761c0430ce5604429b742e6
            FRONTEND_I18N_URL=https://github.com/OpenListTeam/OpenList-Frontend/releases/download/v4.2.6/i18n.tar.gz
          push: true
          tags: |
            invokerkael/openlist:cloudsync-writeback
            invokerkael/openlist:833db4a-uic55b12c
          provenance: false
