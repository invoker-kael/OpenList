name: WebDAV Writeback Tests

on:
  push:
    branches: ["feature/cloudsync-writeback"]
    paths:
      - "internal/writeback/**"
      - "internal/model/webdav_writeback.go"
      - "internal/db/db.go"
      - "internal/conf/**"
      - "server/webdav/**"
      - "server/handles/webdav_writeback.go"
      - "server/router.go"
      - ".github/workflows/writeback.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "internal/writeback/**"
      - "server/webdav/**"
      - "server/common/proxy.go"
      - "server/common/proxy_test.go"
      - "drivers/115_open/**"
      - "internal/model/webdav_writeback.go"
      - "internal/db/db.go"
      - "internal/conf/**"
      - ".github/workflows/writeback.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Go writeback tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27.1"
          cache: true

      - name: Format preview
        run: |
          files=(
            internal/model/webdav_writeback.go
            internal/db/db.go
            internal/conf/config.go
            internal/writeback/writeback.go
            internal/writeback/writeback_test.go
            server/webdav/file.go
            server/webdav/webdav.go
            server/webdav/precondition.go
            server/webdav/precondition_test.go
            server/webdav/util.go
            server/webdav/util_test.go
            server/common/proxy.go
            server/common/proxy_test.go
            drivers/115_open/driver.go
            drivers/115_open/types.go
            drivers/115_open/upload.go
          )
          gofmt -w "${files[@]}"
          if ! git diff --quiet -- "${files[@]}"; then
            echo "gofmt would change:"
            git diff -- "${files[@]}"
          fi

      - name: Unit and compile tests
        run: go test ./internal/writeback ./server/webdav ./server/common ./server/handles ./server ./drivers/115_open

      - name: Format gate
        run: git diff --exit-code
